global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'kafka'
    static_configs:
      - targets: ['kafka-exporter:9308']

  - job_name: 'spark'
    static_configs:
      - targets: ['spark:8081']

  - job_name: 'mongo'
    static_configs:
      - targets: ['mongo-exporter:9216']

  - job_name: "air_quality"
    static_configs:
      - targets: ["metrics-exporter:9100"]